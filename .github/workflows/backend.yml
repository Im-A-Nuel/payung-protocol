name: backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: payung
          POSTGRES_PASSWORD: payung
          POSTGRES_DB: payung
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://payung:payung@localhost:5432/payung?sslmode=disable
      TEST_DATABASE_URL: postgres://payung:payung@localhost:5432/payung?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - name: Run migrations
        run: go run ./cmd/migrate

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v
